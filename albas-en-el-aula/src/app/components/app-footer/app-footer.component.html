<ion-footer class="app-footer">

    <nav class="footer-links">
      <a routerLink="/aviso-legal">Aviso legal</a>
      <a routerLink="/privacidad">Privacidad</a>
      <a routerLink="/cookies">Cookies</a>
      <a routerLink="/condiciones">Condiciones de compra</a>
    </nav>


    <div class="footer-social">
      <a href="https://www.tiktok.com/@albas.enelaula" target="_blank" rel="noopener" aria-label="TikTok">
        <ion-icon name="logo-tiktok"></ion-icon>
      </a>
      <a href="https://www.instagram.com/albas.enelaula" target="_blank" rel="noopener" aria-label="Instagram">
        <ion-icon name="logo-instagram"></ion-icon>
      </a>
      <a href="mailto:tucorreo@ejemplo.com" aria-label="Email">
        <ion-icon name="mail-outline"></ion-icon>
      </a>

      <ion-list>
        <ion-item>
          <ion-input class="footer-form" label="Suscribete" type="email" [clearInput]="true" placeholder="correo@ejemplo"></ion-input>
          <ion-button color="tertiary">
            Suscribete

        </ion-item>
      </ion-list>
